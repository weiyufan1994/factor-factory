# Distribution choices, not a runtime permission system. Historical sources stay in Git.
[framework]
include = [
  "factor_factory/*", "scripts/*", "skills/*", "tests/*", "examples/*",
  "fixtures/*", "docs/*", "packaging/*", ".gitignore", "AGENTS.md",
  "pyproject.toml", "requirements-test.txt", "requirements-knowledge.txt", "pytest-offline.ini",
]
exclude = [
  "docs/superpowers/*", "docs/operations/*", "scripts/deprecated/*",
  "factor_factory/epistemic_host_bootstrap_expectation_proposal.py",
  "factor_factory/epistemic_candidate_definition_generation.py",
  "factor_factory/epistemic_dual_steward_review_handoff.py",
  "scripts/build_factorforge_epistemic_expectation_proposal.py",
  "scripts/build_factorforge_epistemic_candidate_definition.py",
  "scripts/build_factorforge_epistemic_dual_steward_review_handoff.py",
  "factor_factory/console/run_service.py", "factor_factory/console/static_app.py",
  "scripts/run_factorforge_console.py", "scripts/run_factorforge_console_smoke.py",
  "scripts/tushare_*", "scripts/run_tushare_*", "scripts/sync_tushare_*",
  "scripts/*clean_daily*", "scripts/build_daily_clean_enhanced.py",
  "scripts/merge_daily_incremental_into_daily.py", "scripts/preprocess_daily_data.py",
  "scripts/publish_qlib_daily_provider.py", "scripts/refresh_factorforge_console_catalog.py",
  "tests/test_factorforge_console*.py", "tests/test_factorforge_epistemic*.py",
  "tests/test_prepare_pfvv_evaluation_inputs_20260909.py",
  "fixtures/step1/kakushadze_101_formulas.pdf", "fixtures/step2/sample_report_stub.pdf",
]

# This input snapshot is used only to rebuild the existing advisory projection.
# It is not copied wholesale into the distribution.
[knowledge_input]
include = [
  "knowledge/因子工厂/graph/*", "knowledge/因子工厂/taxonomy/*",
  "knowledge/因子工厂/workspace_experience_exports/*",
]

# Independent SDK: client implementation, local resources and consumer tests.
# No upstream source modification and no production/backfill scripts.
[data_sdk]
include = [
  "factorforge_data_api/*", "pyproject.toml", "README.md",
  "docs/physical-column-contract.zh-CN.md", "docs/data-api-architecture.md",
  "docs/factorforge-step3-step4-data-api-usage.md", "docs/manus-data-api-usage.md",
  "tests/test_read_policy_and_snapshot_consistency.py", "tests/test_data_api_package.py",
  "tests/test_partitioned_csv_datasets.py", "tests/test_physical_column_contract.py",
  "tests/test_query_snapshots.py", "tests/test_bounded_reading.py",
  "tests/test_delivery_contract.py",
]
